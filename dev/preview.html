<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width"><meta name="user-login" content="you"><title>GH Extensions · preview</title><link rel="stylesheet" href="/extension/content.css">
<style>
:root { --fgColor-default:#1f2328; --fgColor-muted:#59636e; --bgColor-default:#fff; --bgColor-muted:#f6f8fa; --borderColor-default:#d1d9e0; } *{box-sizing:border-box} body{margin:0;background:#fff;color:#1f2328;font:14px/1.5 -apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif}nav{background:#f6f8fa;border-bottom:1px solid #d1d9e0;padding:20px 32px;display:flex;gap:24px;align-items:center}nav img{width:28px;height:28px}nav a,a{color:#0969da}nav strong{flex:1}.demo-banner{background:#ddf4ff;color:#0969da;font-size:12px;padding:8px 32px}main{max-width:1150px;margin:auto;padding-top:20px}h1{font-weight:500;font-size:25px;margin:12px 24px}.subtitle{margin:12px 24px 20px;color:#59636e}.review-thread{border:1px solid #d1d9e0;border-radius:8px;margin:20px 24px;padding:0 20px 16px}.js-comment{padding:16px 0;border-bottom:1px solid #d1d9e0}.js-comment p{margin:10px 0}.author{font-weight:600;text-decoration:none}small{color:#59636e}textarea{width:100%;margin-top:16px;padding:10px;border:1px solid #d1d9e0;border-radius:6px}.native-diff{margin:24px;border:1px solid #d1d9e0;border-radius:8px;padding:20px}.diff{font:13px/1.7 ui-monospace,monospace;background:#dafbe1;padding:12px;border-radius:6px;white-space:pre-wrap}
</style></head><body><nav><img src="/extension/icons/48.png" alt=""><strong>octocat / release-service</strong><a href="/?view=compare">Compare demo</a><a href="/?view=review">Review demo</a></nav><div class="demo-banner">LOCAL PREVIEW · Synthetic repository and comments · No GitHub requests</div><main><h1 id="title"></h1><p class="subtitle" id="subtitle"></p><div id="fixture"></div></main>
<script src="/extension/core.js"></script><script src="/extension/review.js"></script><script>
const compareDemo = new URLSearchParams(location.search).get('view') !== 'review';
GHECore.route = () => compareDemo ? {owner:'octocat',repo:'release-service',kind:'compare',base:'v1.8.0',head:'v1.9.0'} : {owner:'octocat',repo:'release-service',kind:'pull',number:'42'};
document.querySelector('#title').textContent = compareDemo ? 'Comparing v1.8.0…v1.9.0' : 'Make release checks resilient #42';
document.querySelector('#subtitle').textContent = compareDemo ? 'Every commit, in both directions. Focus on the changes that landed.' : 'Conversation · 2 review threads · Try “Only mine” to focus on your review.';
document.querySelector('#fixture').innerHTML = compareDemo ? '<div class="native-diff"><strong>Files changed</strong><p>GitHub’s original diff remains available below the extension.</p><div class="diff">+ retryPolicy: exponential\n+ maxAttempts: 3\n+ timeout: 5000</div></div>' : '<div class="review-thread"><div class="js-comment"><a class="author" href="/you">you</a> <small>started a thread · release/config.ts</small><p>Can we cover the retry limit when the upstream service is unavailable?</p></div><div class="js-comment"><a class="author" href="/teammate">teammate</a> <small>replied</small><p>Added a test for the third failed attempt and the timeout case.</p></div><textarea placeholder="Reply to this thread" aria-label="Reply to your thread"></textarea></div><div class="review-thread"><div class="js-comment"><a class="author" href="/build-bot">build-bot</a> <small>started a thread · checks.ts</small><p>Automated suggestion: rename the local variable.</p></div><div class="js-comment"><a class="author" href="/you">you</a> <small>replied</small><p>We can address that separately.</p></div></div>';
let saved = {mode:'all',users:''};
globalThis.chrome = {runtime:{sendMessage:async message => {
 if(message.type==='prefs')return {data:saved};
 if(message.type==='savePrefs'){saved=message.prefs;return {data:saved};}
 if(message.type==='settings'){document.querySelector('.ghe-heading button').textContent='Settings available after installation';return {data:{}};}
 const entries = message.reverse ? [['5dd012a','Repair rollback migration','squash']] : [['3b17fda','Merge pull request #142: retry release checks','merge'],['8c91ed2','Add migration safeguards (#146)','squash'],['a918e2c','Add upstream timeout regression test','ordinary'],['b18d9e2','Refactor local helper','ordinary']];
 return {data:entries.map(([sha,title,kind])=>({sha,kind,commit:{message:title}}))};
}}};
</script><script src="/extension/content.js"></script></body></html>
